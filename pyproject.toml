[project]
name = "abs-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Bartosz Sypniewski",email = "bartosz.sypniewski@netapp.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.1,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "fpdf2>=2.8.7,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    # Required by starlette.testclient / fastapi.testclient for HTTP-level tests.
    "httpx2>=0.28.0",
]

[tool.uv]
# ABS Tracker is an application, not a library: it is always run from the repo
# root (uvicorn app.main:app / python abs_tracker.py), so there is nothing to
# build or install for the project itself — only its dependencies.
package = false

[tool.pytest.ini_options]
# The repo root must be importable for `core`, `app`, `ai`, `ml` and `report`.
pythonpath = ["."]
testpaths = ["tests"]
